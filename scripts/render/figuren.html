<!doctype html>
<!-- Render-Werkzeug (nur Entwicklung): Standbilder der KI-Figuren als Ersatz ohne JavaScript/3D. -->
<meta charset="utf-8" />
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<canvas id="c"></canvas>
<script type="module">
  import * as THREE from 'three';
  import { baueBuehne, bewege } from '/src/scripts/ki-figuren.js';
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(600, 600, false);
  window.rendereAlles = () => {
    const out = {};
    for (let i = 0; i < 4; i++) {
      const b = baueBuehne(i, renderer);
      bewege(b, 0.6, i === 0 ? 0.6 : 0, { x: 0.15, y: 0 });
      renderer.setClearColor(0x000000, 0);
      renderer.render(b.szene, b.kamera);
      out[`figur-${i}`] = { daten: canvas.toDataURL('image/webp', 0.88), b: 600, h: 600 };
    }
    return out;
  };
  window.bereit = true;
</script>
